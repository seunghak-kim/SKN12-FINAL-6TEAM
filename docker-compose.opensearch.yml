services:
  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: opensearch-node
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=MyStrongPassword123!"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - 9200:9200
      - 9600:9600
    networks:
      - opensearch-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    ports:
      - 5601:5601
    environment:
      # [수정] 호스트 이름을 container_name이 아닌 서비스 명(opensearch)으로 통일하는 것이 안전합니다.
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
    networks:
      - opensearch-net
    depends_on:
      - opensearch

  opensearch-init:
    build:
      context: ./backend/llm/opensearch_modules
      dockerfile: Dockerfile
    container_name: opensearch-init
    depends_on:
      - opensearch
    environment:
      # [확인] 서비스 명 'opensearch'를 사용하여 내부 네트워크 통신
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USERNAME=admin
      - "OPENSEARCH_PASSWORD=MyStrongPassword123!"
      - OPENSEARCH_USE_SSL=true
      - OPENSEARCH_VERIFY_CERTS=false
      - OPENSEARCH_SSL_SHOW_WARN=false
    networks:
      - opensearch-net

networks:
  opensearch-net:
    name: skn12-shared-net
    driver: bridge

volumes:
  opensearch-data:
